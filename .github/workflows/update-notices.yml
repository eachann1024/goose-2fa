name: Sync published update notices

on:
  push:
    branches: [main]
    paths:
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-notice-mirrors
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Translate CHANGELOG and publish the notice feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 .github/scripts/publish_notice_feed.py
      - name: Purge the published feed from CDN caches
        run: >-
          curl --fail --silent --show-error --max-time 20 --retry 2
          https://purge.jsdelivr.net/gh/eachann1024/goose-2fa@main/public/update-notices.json
