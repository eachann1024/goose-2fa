# AI 审核使用 Codex CLI 与 CODEX_AUTH_JSON（ChatGPT 登录），参考鹅笔记。
# 审核只读默认分支脚本和 PR diff，不执行 PR 代码。
# 仓库主人的同仓库 PR 在 safe_to_merge 时可以自动合并受保护路径；密钥路径始终转人工。
# fork 不跑审核/合并：不检出 PR 代码，也不注入 CODEX_AUTH_JSON。
# workflow_dispatch 仅验收审核结果，不触发合并、评论或标签。
# Secret 缺失、审核异常或输出不合法时失败。审核 JSON 只走 artifact，不走 job output。

name: AI review & auto-merge

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: '同仓库 PR 编号（只读验收，可选已关闭 PR）'
        required: true
        type: string
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled]

permissions: {}

concurrency:
  group: ai-review-${{ github.event.pull_request.number || format('validation-{0}', inputs.pr_number) }}
  cancel-in-progress: true

env:
  AUTOMERGE_LABEL: bot-automerge          # Bot 开 PR 时加这个标签才会自动合并
  BLOCK_LABEL: needs-human                # 不合并时打的标签
  ALLOWED_AUTHORS: eachann1024            # 逗号分隔；只合并这些作者的 PR
  ALLOW_CAUTION: "true"                   # merge_with_caution 不是致命问题，默认放行（用户口径：没有致命问题就合并）
  CHECKS_TIMEOUT_MIN: "20"                # 等其他 CI 的上限，超时不合并
  # 路径规则：以 / 结尾=任意层级目录；以 * 开头=后缀；其他=文件名前缀。
  # 受保护路径：fork 或其他作者命中后转人工（needs-human），并且仍要 bot-automerge 才进入合并。
  # 仓库主人（ALLOWED_AUTHORS，当前 eachann1024）的同仓库 PR，审核结论为 safe_to_merge 时，
  # 即使命中这些路径也 squash 自动合并，不要求 bot-automerge。密钥材料不在此豁免内，见 SECRET_PATHS。
  PROTECTED_PATHS: ".github/,.pr_agent.toml,.gemini/,.coderabbit.yaml,.greptile/,deploy/,vercel.json,netlify.toml,fly.toml,wrangler.toml,render.yaml,Dockerfile,docker-compose,compose.yaml,compose.yml,Procfile"
  # 密钥材料按路径段判断。任何作者（含仓库主人的 safe_to_merge）命中后都不自动合并，并打 needs-human。
  # secrets、credentials 必须是完整路径段（如 .github/secrets/production.json）。
  # .env*、id_rsa* 是段前缀；*.pem、*.key、*.p12 是段后缀。
  # 重命名同时看 filename 和 previous_filename（改入或改出都算）；删除的文件同样算。
  SECRET_PATHS: ".env*,secrets,credentials,*.pem,*.key,*.p12,id_rsa*"

jobs:
  review:
    name: ai-review
    # 只审同仓库、作者是仓库主人的非草稿 PR（作者名与 env.ALLOWED_AUTHORS 保持一致）。
    # fork 不进入本 job：不检出 PR 代码，也不注入 CODEX_AUTH_JSON。labeled 只在自动合并标签时触发。
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'eachann1024' &&
      github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' || github.event.label.name == 'bot-automerge')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout review script from default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Codex review (ChatGPT login)
        id: pragent
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash .github/codex-review/run.sh > "$RUNNER_TEMP/gate-review.json"
      # 审核结果只上传产物。放进 job output 会触发
      # "Skip output 'review' since it may contain secret"，闸门拿到的 REVIEW_JSON 会是空的。
      - name: Upload review result
        uses: actions/upload-artifact@v4
        with:
          name: gate-review
          path: ${{ runner.temp }}/gate-review.json
          if-no-files-found: error


  validate:
    name: ai-review-validation
    # 手动验收仅生成审核结果；不调用合并闸门、不写评论或标签。
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted review script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve owned same-repository PR
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          pr, repo = os.environ['PR'], os.environ['REPO']
          if not re.fullmatch(r'[1-9][0-9]*', pr):
              raise SystemExit('PR 编号不合法')
          info = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/pulls/{pr}'], text=True))
          if info['user']['login'] != 'eachann1024' or (info['head'].get('repo') or {}).get('full_name') != repo:
              raise SystemExit('只允许仓库主人的同仓库 PR')
          sha = info['head']['sha']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('PR 提交不合法')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'sha={sha}\n')
          PY
      - name: Validate Codex review (read-only)
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ steps.target.outputs.sha }}
        run: |
          bash .github/codex-review/run.sh > "$RUNNER_TEMP/validated-review.json"
          {
            echo '## Codex 审核验收'
            echo
            echo '```json'
            cat "$RUNNER_TEMP/validated-review.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload review result
        uses: actions/upload-artifact@v4
        with:
          name: codex-review-validation
          path: ${{ runner.temp }}/validated-review.json
          if-no-files-found: error
          retention-days: 7

  gate:
    name: ai-merge-gate
    needs: review
    # review 失败/超时也要进来打标签（被新提交取消的旧运行不进来），只处理同仓库 PR
    if: >-
      !cancelled() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'eachann1024' &&
      github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' || github.event.label.name == 'bot-automerge')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write        # 合并 + 删除分支
      pull-requests: write   # 打标签、评论
      issues: write
      checks: read
      statuses: read
      actions: read
    steps:
      - name: Checkout gate script from default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      # 下载失败留给 merge.py：审核成功但产物缺失时，闸门用明确原因失败，而不是空的 REVIEW_JSON。
      - name: Download review result
        if: needs.review.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: gate-review
          path: ${{ runner.temp }}/gate-review
      - name: Decide and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_RESULT: ${{ needs.review.result }}
          REVIEW_FILE: ${{ runner.temp }}/gate-review/gate-review.json
        run: python3 .github/codex-review/merge.py
